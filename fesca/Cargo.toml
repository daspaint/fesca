[package]
name = "fesca"
version = "0.1.0"
edition = "2024"
description = "Framework for Efficient Secure Collaborative Analytics"
authors = ["Mimoun Mendoughe", "Darya Igonina"]
readme = "README.md"

[workspace]
resolver = "3"
members = [
    "data_analyst",
    "data_owner",
    "computing_node",
    "helpers"
]

[dependencies]
data_analyst = { version = "0.1.0", path = "data_analyst" }
data_owner = { version = "0.1.0", path = "data_owner" }
computing_node = { version = "0.1.0", path = "computing_node" }
helpers = { version = "0.1.0", path = "helpers" }
rand = "0.9.1"
serde = "1.0.219"
anyhow = "1.0.98"
dotenv = "0.15"
env_logger = "0.11"
log = "0.4"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
tonic = { version = "0.12", features = ["transport"] }
prost = "0.13"
hdrhistogram = "7"
