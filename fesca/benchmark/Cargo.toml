[package]
name = "benchmark"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
tonic = { version = "0.12", features = ["transport"] }
prost = "0.13"
hdrhistogram = "7"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[build-dependencies]
tonic-build = "0.12"
