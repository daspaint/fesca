[package]
name = "data_analyst"
version = "0.1.0"
edition = "2024"

[dependencies]
sqlparser   = "0.25"
log         = "0.4"
env_logger  = "0.11"
dotenv      = "0.15"
anyhow      = "1.0"
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bitvec = { version = "1.0", features = ["serde"] }
tonic = "0.12"
prost = "0.13"
tokio = { version = "1.0", features = ["full"] }
dirs = "4.0"
glob = "0.3"

[[bin]]
name = "table_encoder"
path = "src/test/table_encoder.rs"

[build-dependencies]
tonic-build = "0.12"

