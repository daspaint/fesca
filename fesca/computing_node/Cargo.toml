[package]
name = "computing_node"
version = "0.1.0"
edition = "2021"

[dependencies]
rand = "0.9.1"
# gRPC dependencies for receiving shares
tonic = { version = "0.12", features = ["transport"] }
prost = "0.13"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
log = "0.4"
glob = "0.3"
dirs = "4.0"
bincode = "1.3"
data_owner = "path = ../data_owner"

[build-dependencies]
tonic-build = "0.12"
prost-build = "0.13"


